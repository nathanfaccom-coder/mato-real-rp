function roll(n){return 1+Math.floor(Math.random()*n)}
function rollExpr(expr){const normalized=String(expr).replace(/(\d+)\s*[×x]\s*(\d+)d(\d+)/gi,(_,n,c,d)=>String(Number(n)*Number(c))+'d'+d);const dice=/(\d*)d(\d+)/ig;let match,parts=[],total=0;while((match=dice.exec(normalized))!==null){const count=Math.min(5,Math.max(1,Number(match[1])||1)),sides=Number(match[2]);if(![4,6,8,10,12,20].includes(sides))continue;const values=Array.from({length:count},()=>roll(sides));total+=values.reduce((a,b)=>a+b,0);parts.push(values.join(' + '))}return parts.length?{total,detail:parts.join(' | ')}:null}

function encode(p){const raw=JSON.stringify(validate(p));const bytes=new TextEncoder().encode(raw);let str='';for(const v of bytes)str+=String.fromCharCode(v);return btoa(str).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function decode(raw){let s=String(raw||'').trim();const m=s.match(/[#?&]f=([A-Za-z0-9_-]+)/);if(m)s=m[1];if(!/^[A-Za-z0-9_-]{12,12000}$/.test(s))throw Error('Código inválido');const b=atob(s.replace(/-/g,'+').replace(/_/g,'/'));const bytes=Uint8Array.from(b,c=>c.charCodeAt(0));return validate(JSON.parse(new TextDecoder().decode(bytes)))}
